name: Publish

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # NativeAOT cannot cross-compile: each RID must be built on its own OS.
          - os: windows-latest
            rid: win-x64
            binary: TinyTrophy.exe
            artifact: tinytrophy_windows_amd64.exe
          - os: ubuntu-latest
            rid: linux-x64
            binary: TinyTrophy
            artifact: tinytrophy_linux_amd64

    runs-on: ${{ matrix.os }}

    env:
      PROJECT_PATH: 'src/TinyTrophy.csproj'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install NativeAOT prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish ${{ matrix.rid }} binary
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -r ${{ matrix.rid }} -o ./publish

      - name: Rename ${{ matrix.rid }} binary
        run: mv ./publish/${{ matrix.binary }} ./publish/${{ matrix.artifact }}

      # The native dependencies are embedded in the executable, so a single file ships.
      - name: Generate build provenance
        uses: actions/attest@v4
        with:
          subject-path: './publish/${{ matrix.artifact }}'

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tinytrophy-${{ matrix.rid }}
          path: ./publish/${{ matrix.artifact }}
