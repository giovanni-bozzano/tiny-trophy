name: Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  publish:
    runs-on: windows-latest

    env:
      PROJECT_PATH: 'src/TinyTrophy.csproj' 

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # Install the .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    # Publish the Windows x64 application
    - name: Publish application
      run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -r win-x64 -o ./publish/tinytrophy_windows_amd64.exe

    # Publish the Linux x64 application
    - name: Publish application
      run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -r linux-x64 -o ./publish/tinytrophy_linux_amd64

    # Upload the entire publish folder containing the .exe and required files
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: TinyTrophy
        path: ./publish/*
