name: Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  publish:
    runs-on: windows-latest

    env:
      PROJECT_PATH: 'src/TinyTrophy.csproj' 

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Publish Windows x64 application
      run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -r win-x64 -o ./publish -p:TargetName=tinytrophy_windows_amd64

    - name: Publish Linux x64 application
      run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -r linux-x64 -o ./publish -p:TargetName=tinytrophy_linux_amd64

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: TinyTrophy
        path: ./publish/*
